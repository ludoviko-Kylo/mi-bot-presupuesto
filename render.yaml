services:
  - type: web
    name: mi-bot-presupuesto
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_CURRENCY
        value: "S/"
      - key: HOST
        value: "0.0.0.0"

